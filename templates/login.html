{% extends "base.html" %}

{% block title %}Sign in · Server Monitor{% endblock %}

{% block content %}
<section class="auth-panel">
  <p class="eyebrow">Admin access</p>
  <h1>Sign in</h1>
  <p class="lede">Use the configured admin account. Metrics views are read-only.</p>

  {% if error %}
  <p class="form-error" role="alert">{{ error }}</p>
  {% endif %}

  <form class="auth-form" method="post" action="{{ url_for('main.login', next=request.args.get('next')) }}" autocomplete="off">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label class="field">
      <span>Username</span>
      <input type="text" name="username" value="admin" required autofocus>
    </label>
    <label class="field">
      <span>Password</span>
      <input type="password" name="password" required>
    </label>
    <button class="btn btn--primary" type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
